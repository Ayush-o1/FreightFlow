services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: freightflow/backend:local
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/freightflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-jwt-secret-with-at-least-thirty-two-characters
      JWT_REFRESH_SECRET: local-refresh-secret-with-at-least-thirty-two-chars
      JWT_EXPIRES_IN: 15m
      CLIENT_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: strict
      TRUST_PROXY: "1"
      QUEUE_CONCURRENCY: 2
      CACHE_TTL: 300
      QUEUE_WORKERS_ENABLED: "true"
      OTEL_SERVICE_NAME: freightflow-api
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/ready').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: freightflow/frontend:local
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:
  redis_data:
