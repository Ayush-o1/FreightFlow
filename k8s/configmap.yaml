apiVersion: v1
kind: ConfigMap
metadata:
  name: freightflow-config
  namespace: freightflow
  labels:
    app.kubernetes.io/name: freightflow
data:
  NODE_ENV: "production"
  PORT: "5001"
  CLIENT_URL: "https://freightflow.example.com"
  COOKIE_SECURE: "true"
  COOKIE_SAME_SITE: "none"
  TRUST_PROXY: "1"
  JWT_EXPIRES_IN: "15m"
  ACCESS_TOKEN_COOKIE_MAX_AGE_MS: "900000"
  REDIS_URL: "redis://redis:6379"
  QUEUE_CONCURRENCY: "4"
  CACHE_TTL: "300"
  QUEUE_WORKERS_ENABLED: "true"
  LOG_LEVEL: "info"
  LOG_ENABLED: "true"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "freightflow-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
