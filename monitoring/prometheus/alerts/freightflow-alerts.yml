groups:
  - name: freightflow.platform
    rules:
      - alert: FreightFlowHighErrorRate
        expr: |
          (
            sum(rate(freightflow_http_request_errors_total[5m]))
            /
            clamp_min(sum(rate(freightflow_http_requests_total[5m])), 1)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: freightflow-api
        annotations:
          summary: FreightFlow API error rate is high
          description: More than 5 percent of API requests have returned 4xx/5xx for 10 minutes.

      - alert: FreightFlowMongoUnavailable
        expr: freightflow_dependency_ready{dependency="mongo"} == 0
        for: 5m
        labels:
          severity: critical
          service: mongodb
        annotations:
          summary: MongoDB is unavailable to FreightFlow
          description: FreightFlow readiness metrics report MongoDB as unavailable for at least 5 minutes.

      - alert: FreightFlowRedisUnavailable
        expr: freightflow_dependency_ready{dependency="redis"} == 0
        for: 5m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: Redis is unavailable to FreightFlow
          description: FreightFlow readiness metrics report Redis as unavailable for at least 5 minutes.

      - alert: FreightFlowQueueBacklog
        expr: sum(freightflow_queue_backlog{state=~"waiting|delayed|prioritized"}) by (queue) > 100
        for: 10m
        labels:
          severity: warning
          service: bullmq
        annotations:
          summary: FreightFlow queue backlog is growing
          description: Queue {{ $labels.queue }} has more than 100 pending jobs for at least 10 minutes.

      - alert: FreightFlowAuthFailureSpike
        expr: sum(rate(freightflow_auth_failures_total[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: freightflow-api
        annotations:
          summary: FreightFlow authentication failures spiked
          description: Authentication and authorization failures exceeded 2 per second for 5 minutes.

      - alert: FreightFlowHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(freightflow_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: freightflow-api
        annotations:
          summary: FreightFlow API latency is high
          description: API p95 latency has stayed above 1 second for 10 minutes.
